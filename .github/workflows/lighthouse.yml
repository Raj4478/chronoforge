name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Performance, accessibility, SEO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Lighthouse's SEO audit expects the tested pages to be crawlable.
      # Normal preview/dev builds remain noindex; this override applies only
      # inside this isolated CI job.
      NEXT_PUBLIC_ALLOW_INDEX: "true"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install --no-save @lhci/cli@0.15.x

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=./lighthouserc.cjs
